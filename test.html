<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #313338;
            color: #dbdee1;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100%;
        }

        .chat-header {
            background: #313338;
            padding: 12px 16px;
            border-bottom: 1px solid #26282c;
            display: flex;
            align-items: center;
            height: 48px;
        }

        .channel-name {
            color: #f2f3f5;
            font-weight: 600;
            font-size: 16px;
        }

        .channel-icon {
            color: #80848e;
            margin-right: 8px;
            font-size: 20px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .messages-container::-webkit-scrollbar {
            width: 16px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: #2b2d31;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #1a1b1e;
            border: 4px solid #2b2d31;
            border-radius: 8px;
        }

        .message {
            padding: 2px 0;
            margin-bottom: 4px;
            position: relative;
        }

        .message:hover {
            background: #2e3035;
        }

        .message-content {
            padding: 2px 48px 2px 72px;
            min-height: 2.75rem;
            display: flex;
            align-items: center;
        }

        .avatar {
            position: absolute;
            left: 16px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            color: white;
            font-size: 16px;
        }

        .username {
            font-weight: 500;
            color: #f2f3f5;
            margin-right: 8px;
            cursor: pointer;
        }

        .username:hover {
            text-decoration: underline;
        }

        .timestamp {
            font-size: 12px;
            color: #949ba4;
            margin-right: 8px;
        }

        .message-text {
            color: #dbdee1;
            word-wrap: break-word;
        }

        .input-container {
            padding: 16px;
            background: #313338;
        }

        .input-wrapper {
            background: #383a40;
            border-radius: 8px;
            padding: 11px 16px;
        }

        input[type="text"] {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #dbdee1;
            font-size: 15px;
            font-family: inherit;
        }

        input[type="text"]::placeholder {
            color: #6d6f78;
        }

        .loading {
            text-align: center;
            color: #949ba4;
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <span class="channel-icon">#</span>
            <span class="channel-name">general</span>
        </div>
        
        <div class="messages-container" id="messagesContainer">
            <div class="loading">Loading messages...</div>
        </div>
        
        <div class="input-container">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Message #general"
                    autocomplete="off"
                >
            </div>
        </div>
    </div>

    <script>
        const webhookUrl = 'https://discord.com/api/webhooks/1305339036596048004/NYqAuXYsyktftZ1yNQcUbLZevasJJ9JGy8GbhjuenrxhdwjhPR40GKITGOecBjc4EJGf';
        const messageInput = document.getElementById('messageInput');
        const messagesContainer = document.getElementById('messagesContainer');
        
        let messages = [];

        // Render messages
        function renderMessages() {
            messagesContainer.innerHTML = '';
            
            if (messages.length === 0) {
                messagesContainer.innerHTML = '<div class="loading">No messages yet. Start chatting!</div>';
                return;
            }
            
            messages.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message';
                
                const avatar = getAvatarInitial(msg.username);
                const timestamp = formatTime(msg.timestamp);
                
                messageDiv.innerHTML = `
                    <div class="message-content">
                        <div class="avatar">${avatar}</div>
                        <span class="username">${escapeHtml(msg.username)}</span>
                        <span class="timestamp">${timestamp}</span>
                        <span class="message-text">${escapeHtml(msg.content)}</span>
                    </div>
                `;
                
                messagesContainer.appendChild(messageDiv);
            });
            
            scrollToBottom();
        }

        // Send message
        messageInput.addEventListener('keypress', async function(e) {
            if (e.key === 'Enter') {
                const message = messageInput.value.trim();
                
                if (!message) return;

                // Add message to local display
                const newMessage = {
                    username: 'You',
                    content: message,
                    timestamp: new Date().toISOString()
                };
                
                messages.push(newMessage);
                renderMessages();
                messageInput.value = '';

                // Send to Discord
                try {
                    const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(webhookUrl);
                    await fetch(proxyUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            content: message
                        })
                    });
                } catch (error) {
                    console.error('Error sending message:', error);
                }
            }
        });

        // Helper functions
        function getAvatarInitial(username) {
            return username.charAt(0).toUpperCase();
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const today = new Date();
            
            if (date.toDateString() === today.toDateString()) {
                return 'Today at ' + date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            } else {
                return date.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' }) + ' ' + 
                       date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Initial render
        renderMessages();
    </script>
</body>
</html>
